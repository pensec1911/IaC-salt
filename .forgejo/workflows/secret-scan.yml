# Server-side secret scan — the backstop for .githooks/pre-commit, which only runs in clones
# with core.hooksPath set: not for the Forgejo web editor, Renovate or a fresh clone.
#
#   gitleaks        default ruleset + .gitleaks.toml over the new commits (every commit, not
#                   just the tip — a secret added and removed again is still in history);
#                   workflow_dispatch scans the whole history.
#   check-secrets   the pre-commit scanner over the tree (e-mails, public IPs, home paths —
#                   private data gitleaks has no rules for).
#
# Branch protection on main requires the pull_request run. A hit on main means: rotate the
# value in OpenBao, never rewrite history (.claude/docs/secrets.md).
#
# gitleaks comes as a pinned release binary checked against its sha256 — no third-party
# action (see trivy.yml).
name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  secret-scan:
    runs-on: docker
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the commit range needs the history

      - name: install gitleaks
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "/tmp/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  /tmp/$f" | sha256sum -c -
          tar -xzf "/tmp/$f" -C /usr/local/bin gitleaks
          gitleaks version

      - name: gitleaks (new commits)
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          zero=0000000000000000000000000000000000000000
          case "$EVENT" in
            pull_request) range="origin/${BASE_REF}..HEAD" ;;
            push)
              if [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                range="${BEFORE}..HEAD"
              else
                # new branch or force-push past a lost commit: everything not on main yet
                range="HEAD --not origin/main"
              fi ;;
            *) range="" ;; # workflow_dispatch: full history
          esac
          echo "scanning: ${range:-full history}"
          set -- git . --config .gitleaks.toml --redact --no-banner --verbose
          [ -n "$range" ] && set -- "$@" --log-opts="$range"
          gitleaks "$@"

      - name: check-secrets (tree)
        run: python3 .githooks/check-secrets.py --all
