{%- from "authentik/map.jinja" import authentik with context %}
# Managed by Salt (formulas/authentik) — do not edit.
# One OAuth2/OIDC provider + application per app that logs in against
# Authentik itself (authentik:lookup:oidc_apps). client_id = slug, client
# secret from the worker's env (HOMELAB_OIDC_<SLUG>_SECRET, OpenBao
# authentik/oidc-<slug>). Only "{{ authentik.admin_group }}" may log in.
# Issuer / discovery: {{ authentik.external_host }}/application/o/<slug>/
version: 1
metadata:
  name: homelab - OIDC apps
entries:
{%- if authentik.oidc_apps | selectattr('verified_email', 'defined') | selectattr('verified_email') | list %}
  # The built-in email mapping always says email_verified: false. Apps that
  # link existing accounts only by a verified e-mail (verified_email: true,
  # e.g. PatchMon) get this one instead. Only admins log in, and they set
  # their own address — so "verified" holds.
  - model: authentik_providers_oauth2.scopemapping
    id: scope-email-verified
    identifiers:
      name: homelab OIDC email (verified)
    attrs:
      scope_name: email
      description: Email address (verified)
      expression: |
        return {"email": request.user.email, "email_verified": True}
{%- endif %}
{%- for app in authentik.oidc_apps %}
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-{{ app.slug }}
    identifiers:
      name: homelab-oidc-{{ app.slug }}
    attrs:
      client_type: confidential
      # Empty by default for providers not created in the UI (2026.8) — the
      # authorize endpoint then rejects every login ("Invalid grant_type").
      grant_types:
        - authorization_code
        - refresh_token
      client_id: {{ app.slug }}
      client_secret: !Env HOMELAB_OIDC_{{ app.slug | upper }}_SECRET  # secret-scan: allow (env reference)
      redirect_uris:
{%- for uri in app.redirect_uris %}
        - matching_mode: strict
          url: {{ uri }}
{%- endfor %}
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
{%- if app.get('verified_email') %}
        - !KeyOf scope-email-verified
{%- else %}
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
{%- endif %}
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    id: app-{{ app.slug }}
    identifiers:
      slug: {{ app.slug }}
    attrs:
      name: {{ app.name }}
      provider: !KeyOf provider-{{ app.slug }}
      meta_launch_url: {{ app.launch_url }}
      policy_engine_mode: any
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-{{ app.slug }}
      order: 0
    attrs:
      group: !Find [authentik_core.group, [name, {{ authentik.admin_group }}]]
{%- endfor %}
{%- if not authentik.oidc_apps %}
  []
{%- endif %}
